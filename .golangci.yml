# golangci-lint config for specout.
#
# check:  just lint
# repair: just tidy
#
# default: all is deliberate. Every disable below has one reason: the linter's
# advice would make this code worse. Nothing is dropped to hide a finding.
version: "2"

run:
  go: "1.27"
  timeout: 5m

linters:
  default: all
  disable:
    # whitespace and naming opinions that fight gofumpt or legibility
    - wsl
    - wsl_v5
    - nlreturn
    - varnamelen
    - noinlineerr
    # method order by exportedness: the unexported helpers sit next to the
    # type they serve, which reads better than the linter's grouping
    - funcorder
    # these structs mirror OpenAPI and the published Graph API, not Go defaults
    - exhaustruct
    - exhaustruct_v5
    - tagliatelle
    # returning chi.Router and wrapping errors dynamically is the design here
    - ireturn
    - err113
    # package level fixture tables are the clearest form for these
    - gochecknoglobals
    # some tests replace process-wide state, such as the standard logger, so
    # the suite cannot run in parallel
    - paralleltest
    # revive unchecked-type-assertion checks this, and it accepts v, _ := x.(T)
    - forcetypeassert
    # no dependency allow list here
    - depguard
    - gomodguard
    - gomodguard_v2
    # canonicalheader panics on go1.27 generics
    - canonicalheader
  settings:
    govet:
      # every analyzer, nilness and shadow included. fieldalignment would
      # reorder structs by size and break their reading order.
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true
    staticcheck:
      checks: ["all"]
    gocritic:
      enabled-tags: [diagnostic, style, performance, experimental, opinionated]
      disabled-checks:
        # nonamedreturns forbids what this check asks for
        - unnamedResult
        # specout builds its document once, at startup. A pointer to save a
        # 100-byte copy there would let a callee change the caller's value.
        - hugeParam
        - rangeValCopy
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: true
      rules:
        # another linter here already enforces these, with this file's limits:
        # lll, mnd and goconst, gocognit, cyclop, funlen, errcheck
        - name: line-length-limit
          disabled: true
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        - name: unhandled-error
          disabled: true
        # nonamedreturns forbids what this rule asks for
        - name: confusing-results
          disabled: true
        # the OpenAPI mirror types are public structs by design
        - name: max-public-structs
          disabled: true
        # exhaustive checks enum switches; a switch over conditions needs no
        # default
        - name: enforce-switch-style
          disabled: true
        # anonymous structs are the clearest test-table rows
        - name: nested-structs
          disabled: true
        # an internal helper may take a bool where two functions would repeat
        # one body
        - name: flag-parameter
          disabled: true
        # v, _ := x.(T) is a checked assertion that wants the zero value
        # more than three levels of control flow hide the main path
        - name: max-control-nesting
          arguments: [3]
        # past five arguments, a call site has to name its values: use a struct
        - name: argument-limit
          arguments: [5]
        - name: unchecked-type-assertion
          arguments:
            - acceptIgnoredAssertionResult: true
    # size and complexity limits. A function over a limit splits into named
    # steps. cyclop and gocyclo count branches in different ways, so both run.
    cyclop:
      # McCabe's limit
      max-complexity: 10
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    funlen:
      lines: 50
      statements: 35
    nestif:
      min-complexity: 4
    maintidx:
      under: 30
    dupl:
      threshold: 100
    goconst:
      min-occurrences: 3
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    unparam:
      check-exported: true
    testifylint:
      enable-all: true
    lll:
      line-length: 120
    exhaustive:
      # a reflect.Kind switch is not an enum, so a default is the signifier for
      # the "every other kind" case
      default-signifies-exhaustive: true
      check: [switch, mapliteral]
    recvcheck:
      # MarshalJSON takes a value receiver, so a value and a pointer marshal
      # the same way. The type's other methods build it in place.
      exclusions:
        - "*.MarshalJSON"
    wrapcheck:
      # specout errors already say "specout:", and the adapter packages pass
      # them on so callers can match *specout.StrayError
      ignore-package-globs:
        - github.com/happytoolin/specout*
  exclusions:
    rules:
      # tests: fixture literals, table rows and status codes are the readable
      # form there. errcheck, noctx, thelper and testifylint still apply.
      - path: _test.go
        linters:
          - lll
          - funlen
          - goconst
          - mnd
      # tests: a fixture may carry a tag the encoder ignores, and a failed
      # assertion on a decoded document panics, which fails the test
      - path: _test.go
        linters:
          - revive
        text: "^(struct-tag|unchecked-type-assertion):"
      # the examples mirror published documents: their type names, struct tags,
      # status codes and data literals are the published ones
      # the example route files are long tables of published operations, and
      # their op helpers take each operation's fields in published order
      - path: ^examples/
        linters:
          - lll
          - mnd
          - goconst
          - cyclop
          - gocyclo
          - gocognit
          - funlen
          - maintidx
          - forbidigo
      - path: ^examples/
        linters:
          - revive
        text: "^(var-naming|argument-limit):"
      - path: ^examples/
        linters:
          - staticcheck
        text: "^ST1003:"
      # the demo app is sample code: its long inline descriptions and its
      # literal limits are the content
      - path: ^internal/demo/
        linters:
          - lll
          - mnd
      # examplekit.Run is each example's main body, so it may exit
      - path: ^internal/examplekit/
        linters:
          - revive
        text: "^deep-exit:"
      # an example main prints its own URL: that is the demo's whole output
      - path: ^cmd/
        linters:
          - forbidigo
      # internal packages are not importable API, so a comment that only
      # repeats the identifier adds nothing
      - path: ^internal/
        linters:
          - revive
        text: exported|package-comments
      - path: ^cmd/
        linters:
          - revive
        text: package-comments

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/happytoolin/specout

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

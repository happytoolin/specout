name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # CI runs the same recipes a developer runs, so the lint and format
      # settings have one definition: the justfile.
      - uses: extractions/setup-just@v2
      - run: just build
      - run: just lint
      - run: just test
      - run: just race
      - run: just check-golden
      - name: Validate OpenAPI documents and public API contracts
        run: just validate
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate and compile TypeScript client types
        run: just client-types

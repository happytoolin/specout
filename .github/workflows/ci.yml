name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # CI runs the same recipes a developer runs, so the lint and format
      # settings have one definition: the justfile.
      - uses: extractions/setup-just@v2
      - run: just build
      - run: just lint
      - run: just test
      - run: just check-golden
      - name: Spec validates against OpenAPI 3.1 schema
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q openapi-spec-validator
          /tmp/venv/bin/python tools/validate_spec.py testdata/openapi.json

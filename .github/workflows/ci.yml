name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /dev/stderr | (! read) || false
      - run: go test ./...
      - name: Golden spec is committed
        run: |
          GO_SPEC_ONLY=1 go run ./cmd/demo > /tmp/openapi.json
          cmp /tmp/openapi.json testdata/openapi.json || (echo "testdata/openapi.json is stale — regenerate with UPDATE_GOLDEN=1 go test" && exit 1)

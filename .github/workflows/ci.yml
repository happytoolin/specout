name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # CI runs the same recipes a developer runs, so the lint and format
      # settings have one definition: the justfile.
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run all checks
        run: just check
